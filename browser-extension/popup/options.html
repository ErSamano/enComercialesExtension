<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Configuración enComerciales</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 18px; color: #24323a; }
    label { display: block; margin: 18px 0; }
    input[type="url"] { display: block; box-sizing: border-box; width: 100%; padding: 8px; margin-top: 5px; }
    button { padding: 8px 14px; margin-right: 8px; }
    #status { min-height: 20px; }
    #diagnostic { overflow: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Configuración</h1>
    <label>URL base de API
      <input id="api" type="url" placeholder="https://encomerciales.com/api">
    </label>
    <label><input id="debug" type="checkbox"> Activar modo debug</label>
    <button id="save" type="button">Guardar</button>
    <button id="test" type="button">Probar conexión</button>
    <p id="status" role="status" aria-live="polite"></p>
    <h2>Último diagnóstico</h2>
    <pre id="diagnostic">Sin datos</pre>
  </main>
  <script src="./options.js" defer></script>
</body>
</html>
